version: '3.8'

services:
  # Backend Spring Boot Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripnest-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - SUPABASE_URL=${SUPABASE_URL:-https://your-project.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-your-anon-key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
    restart: unless-stopped
    networks:
      - tripnest-network

  # Frontend Vite/React Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripnest-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://backend:8080/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - tripnest-network

networks:
  tripnest-network:
    driver: bridge
